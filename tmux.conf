# Basics
unbind C-b
# Ctrl-a is a modal toggle, not a transient tmux prefix key.
set -g prefix None
# Ctrl-a toggles between the persistent navigation and edit tables.
bind -n C-a set-option key-table prefix
bind -T prefix C-a set-option key-table root

set -g mouse on
# Clicking a pane or window tab selects it and returns to edit mode. Keep the
# drag binding unchanged so dragging inside a pane still enters copy mode.
bind -T root MouseDown1Pane select-pane -t= \; send-keys -M \; set-option key-table root
bind -T prefix MouseDown1Pane select-pane -t= \; send-keys -M \; set-option key-table root
bind -T root MouseDown1Status switch-client -t= \; set-option key-table root
bind -T prefix MouseDown1Status switch-client -t= \; set-option key-table root
# Keep pane selection and copy-mode text marking, but disable mouse pane resizing.
unbind -T root MouseDown1Border
unbind -T root MouseDrag1Border
unbind -T root MouseDown2Border
unbind -T root MouseDrag2Border
unbind -T root MouseDown3Border
unbind -T root MouseDrag3Border
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -s extended-keys-format csi-u
set -g terminal-features "xterm-256color:RGB,tmux-256color:RGB,xterm-256color:extkeys"
set -g mode-keys vi

# Keep mouse selections active so they can be extended across scrollback.
# Press y to copy the selection and exit copy mode.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Look — Solarized Bright
set -g status-style "bg=#fdf6e3,fg=#073642"
# Show whether the client is in persistent navigation mode or normal editing
# input. Both labels are 12 columns wide, preventing the status bar from
# shifting.
set -g status-left-length 12
set -g status-left '#{?#{==:#{client_key_table},prefix},#[bg=#dc322f]#[fg=#fdf6e3]#[bold] NAVIGATION ,#[bg=#268bd2]#[fg=#fdf6e3]#[bold]    EDIT    }#[default]'
set -g status-right " %Y-%m-%d %H:%M "
set -g message-style "bg=#dc322f,fg=#fdf6e3"
set -g message-command-style "bg=#268bd2,fg=#fdf6e3"
set -g mode-style "bg=#eee8d5,fg=#586e75"
# Use tmux's default pane border appearance.
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g pane-border-status off
set -g pane-border-style default
# Match the mode indicator: blue in edit mode, red in navigation mode.
set -g pane-active-border-style "#{?#{==:#{client_key_table},prefix},fg=#dc322f,fg=#268bd2}"
# Solarized Bright: Base2 inactive panes against a Base3 active pane.
set -g window-style "fg=default,bg=#eee8d5"
set -g window-active-style "fg=default,bg=#fdf6e3"
set -gw window-status-format "#[bg=#eee8d5,fg=#586e75] #I:#W "
set -gw window-status-current-format "#[bg=#fdf6e3,fg=#073642,bold] [#I:#W] "
set -g window-status-separator ""

# Prefix bindings
# Use the prefix table as a persistent navigation mode.  key-table is the
# session's default table, so tmux stays here after each command instead of
# falling back to root. Enter/Escape explicitly switch to edit mode.
set -g key-table prefix
set-hook -g client-attached 'set-option key-table prefix'
bind -T prefix Enter set-option key-table root
bind -T prefix Escape set-option key-table root
# Open the session chooser in edit mode so its tree-navigation keys are not
# shadowed by the persistent navigation bindings above.
bind -T prefix s choose-tree -Zs \; set-option key-table root

bind -r h select-pane -L \; set-option key-table prefix
bind -r j select-pane -D \; set-option key-table prefix
bind -r k select-pane -U \; set-option key-table prefix
bind -r l select-pane -R \; set-option key-table prefix
bind -r Left select-pane -L \; set-option key-table prefix
bind -r Down select-pane -D \; set-option key-table prefix
bind -r Up select-pane -U \; set-option key-table prefix
bind -r Right select-pane -R \; set-option key-table prefix

# Keep the client in navigation mode after keyboard window changes. The
# status-bar mouse binding above intentionally switches to edit mode instead.
bind -r C-h previous-window \; set-option key-table prefix
bind -r C-l next-window \; set-option key-table prefix
bind -n C-Left previous-window \; set-option key-table prefix
bind -n C-Right next-window \; set-option key-table prefix

# Keep numeric window selection in navigation mode as well.
bind -r 0 select-window -t :0 \; set-option key-table prefix
bind -r 1 select-window -t :1 \; set-option key-table prefix
bind -r 2 select-window -t :2 \; set-option key-table prefix
bind -r 3 select-window -t :3 \; set-option key-table prefix
bind -r 4 select-window -t :4 \; set-option key-table prefix
bind -r 5 select-window -t :5 \; set-option key-table prefix
bind -r 6 select-window -t :6 \; set-option key-table prefix
bind -r 7 select-window -t :7 \; set-option key-table prefix
bind -r 8 select-window -t :8 \; set-option key-table prefix
bind -r 9 select-window -t :9 \; set-option key-table prefix

# Enforce navigation mode after keyboard pane changes and other
# window-selection commands. Mouse clicks override this hook and return to edit.
set-hook -g after-select-pane 'set-option key-table prefix'
set-hook -g after-select-window 'set-option key-table prefix'

# Escape/Enter return to normal application/editing input.
# (Bindings are declared above with the other prefix-mode bindings.)

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind e select-layout even-horizontal
bind t next-layout
bind r source-file ~/.tmux.conf \; set-option key-table prefix \; display-message "tmux config reloaded (navigation mode)"
